<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Diwas Khatri — Developer profile</title>
  <desc id="desc">A terminal-inspired dark profile card for Diwas Khatri, a developer from Nepal focused on Python, automation, web development, and AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect x="36" y="32" width="1128" height="456" rx="20" fill="#0d1117" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="36" y="32" width="1128" height="54" rx="20" fill="#161b22"/>
  <path d="M36 66h1128" stroke="#30363d"/>
  <circle cx="70" cy="59" r="8" fill="#ff5f57"/><circle cx="96" cy="59" r="8" fill="#febc2e"/><circle cx="122" cy="59" r="8" fill="#28c840"/>
  <text x="160" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b949e">diwas@github: ~/profile</text>
  <text x="78" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#58a6ff">$ whoami</text>
  <text x="78" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="48" font-weight="700" fill="#f0f6fc">Diwas Khatri</text>
  <text x="80" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" fill="#8b949e">developer • builder • lifelong learner</text>
  <rect x="78" y="252" width="1044" height="2" fill="url(#accent)"/>
  <text x="78" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#bc8cff">location:</text><text x="230" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#c9d1d9">Tilottama, Nepal</text>
  <text x="78" y="337" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#bc8cff">focus:</text><text x="230" y="337" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#c9d1d9">Python · Automation · Web · AI</text>
  <text x="78" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#bc8cff">stack:</text><text x="230" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#c9d1d9">JavaScript · React · Tailwind · Git</text>
  <text x="78" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#bc8cff">mission:</text><text x="230" y="411" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#c9d1d9">turn ideas into useful software</text>
  <text x="78" y="455" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#58a6ff">$ echo "build • learn • share"</text><rect x="430" y="438" width="12" height="24" fill="#58a6ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
